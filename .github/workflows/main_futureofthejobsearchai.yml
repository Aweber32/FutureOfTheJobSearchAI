# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy containerized Python Function App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'futureofthejobsearchai' # Set this to your function app name
  REGISTRY_NAME: 'futureofthejobsearchacr' # Your existing ACR name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2DDE0846716946159B13792C91734B8B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2C15163C93D24816A0BC3166FE466486 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F70959546C2C47D39FD0EF6C39496982 }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push container image
        run: |
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.AZURE_FUNCTIONAPP_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.AZURE_FUNCTIONAPP_NAME }}:${{ github.sha }} ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.AZURE_FUNCTIONAPP_NAME }}:latest
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.AZURE_FUNCTIONAPP_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.AZURE_FUNCTIONAPP_NAME }}:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group futureofthejobsearch \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.AZURE_FUNCTIONAPP_NAME }}:${{ github.sha }}
          